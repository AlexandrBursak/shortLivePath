openapi: 3.1.0
info:
  title: short-live-path API
  version: 0.1.0
  description: 'Anonymous, text-only credential sharing through temporary Share links, with repeated explicit
    reading before service-established expiration and an optional separate Reading code. No accounts,
    history, recovery, early removal, files or external credential revocation. Server-readable ephemeral
    Secrets are accepted; minimal lifecycle metadata remains durable. ADR-0008/0009 approve PostgreSQL-write
    lifetime and service time, recovery-before-serving and basic observed quotas. Exact concurrent quota
    reservations are deferred to backlog T22, not a v1 launch gate. Runtime verification is pending; this
    is not an executable or verified security contract. Sources: data-model.md; sad.md S1-S7; spec.md
    US-01-US-05 and AC-01-AC-12 (including AC-11b).'
  x-status: Draft
servers:
- url: /
  description: Same-origin API through the HTTPS reverse proxy; no production host invented.
security: []
tags:
- name: Secrets
  description: Public capability-based sharing, no account or Bearer/JWT authentication.
x-source-documents:
- ../data-model.md
- ../sad.md
- ../spec.md
- ../CONTEXT.md
x-project-decisions:
  error-envelope: Product Owner retained {error:{code,message,details}} during api stage.
  trusted-address: 'ADR-0009 retains ADR-0007: only a pinned immediate proxy supplies one sanitized literal
    address. Canonical full IPv6; IPv4-mapped IPv6 shares IPv4 identity. Stable versioned HMAC-SHA-256
    labels use a 32-byte deployment key, never logged or client-supplied. Invalid/untrusted context returns
    503 service_unavailable before new limiter state; no public forwarding-header parameter.'
  quota-continuity: 'ADR-0009 retains the conservative continuity rule: preserve same-key counters on
    ordinary API restart. On continuity loss/rotation close Secret traffic, fence all old mutations, then
    require at least 60 continuous seconds after the last possible old mutation plus cleanup/reconciliation.
    Restart the interval on discontinuity; never infer fresh quota from missing state. T8/T12 verify single-process
    time/recovery; exact cross-process quota reservations are deferred. No addresses/pseudonyms in logs.'
  creation-time: 'ADR-0008: PostgreSQL clock sampled once at lifecycle INSERT, millisecond-aligned. Immutable
    expires_at = created_at + selected minutes; later commit/Redis/response delay consumes lifetime.'
  quota-accuracy: 'ADR-0009: basic observed rolling counters at 25 creations/address and five failures/link/address.
    Already-admitted concurrent requests may overshoot; exact reservation/lease guarantees are deferred
    to backlog T22. The two-native-call/no-queue cap, input/storage caps, expiry and privacy are not deferred.'
  authentication: 'ADR-0003/0005 and SAD §8: public capability token plus optional code; no BearerAuth.'
  idempotency: 'S2/DM lifecycle semantics: no automatic retry, deduplication or HTTP Idempotency-Key.
    S7 internal run identity does not add HTTP idempotency.'
x-unresolved: []
x-deferred:
- 'DM-OQ-04: exact concurrent quota reservations, backlog T22 outside v1 DAG'
x-verification-obligations:
- T7 hard-cap payload publication
- T8/T12 clocks and recovery before sensitive traffic
- T21 post-scaffold calibration
- T17 actual proxy/key provisioning
- T18 security/fault verification
x-reading-code-work:
  algorithm: argon2id
  version: 19
  memory-kib: 65536
  iterations: 3
  parallelism: 4
  salt-bytes: 16
  output-bytes: 32
  concurrency: 2
  queue: 0
paths:
  /api/v1/secrets:
    post:
      operationId: createSecret
      tags:
      - Secrets
      security: []
      summary: Create a temporary Share link anonymously
      description: 'Explicit creation only. Confirm 201 only after metadata, expiring payload and quota
        accounting are confirmed and readiness/deadline remain safe (S1/S2). No automatic retries, deduplication,
        history or Idempotency-Key guarantee. A manual retry is a new attempt with a fresh token/UUID
        and its own quota gates; possible earlier records retain original expiry. No code-generation endpoint:
        generation is browser-local (twenty unbiased CSPRNG Latin letters/digits). ADR-0008 anchors immutable
        creation/expiration at the PostgreSQL INSERT after verifier preparation; commit/write/response
        delay consumes lifetime, never extends it. Accepted ADR-0006: 1024 UTF-8 code bytes, two concurrent
        hash calls across creation/disclosure, zero waiting queue. Invalid input or global capacity refusal
        starts no hash and adds no code failure. Retain permits until native completion after timeout/disconnect;
        late results do not authorize release.'
      x-user-stories:
      - US-01
      - US-02
      - US-03
      x-acceptance-criteria:
      - AC-01
      - AC-02
      - AC-03
      - AC-04
      - AC-05
      - AC-06
      - AC-11
      x-sequences:
      - S1
      - S2
      - S7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
            examples:
              unprotected:
                value: &id003
                  address: server.example.test
                  login: test-user
                  credential: "TEST KEY\n  synthetic line\n"
              withCode:
                value:
                  address: server.example.test
                  login: test-user
                  credential: "TEST KEY\n  synthetic line\n"
                  lifetime_minutes: 60
                  reading_code: Test code 123
        x-max-wire-bytes: 524288
        x-allowed-content-encodings:
        - identity
        description: application/json only, absent or identity Content-Encoding; no compressed body. Enforce
          524288 wire bytes while receiving, including absent/chunked Content-Length. The wire budget
          includes escaping/packaging and is separate from Secret aggregate UTF-8 bytes. Reject unsupported
          media/encoding with 415 and oversized bodies with 413 before hashing or new admission state;
          safe no-store/no-referrer envelope, no input echo, no incorrect-code failure or confirmed link.
      responses:
        '201':
          description: Confirmed creation only; code and payload are not echoed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSecretResponse'
              examples:
                created:
                  value:
                    data:
                      share_url: https://example.test/s/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                      expires_at: '2026-01-01T13:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
        '422':
          description: Malformed JSON/schema, missing or whitespace-only credential, aggregate text over
            65536 UTF-8 bytes, invalid integer lifetime, enabled code shorter than six code points, or
            code over 1024 UTF-8 bytes. No hash, failed-code increment or confirmed link on invalid input.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  value:
                    error:
                      code: short_live_path.invalid_request
                      message: Request shape, exact-text or lifetime/code constraints are invalid.
                      details: []
          x-error-codes:
          - short_live_path.invalid_request
        '429':
          description: Basic observed threshold of 25 successes per rolling 60 seconds/address. Concurrently
            admitted requests may overshoot; no quota reservations in v1. Preserve current form input;
            wait and retry only deliberately.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                creation_limited:
                  value:
                    error:
                      code: short_live_path.creation_limited
                      message: Basic observed creation threshold reached. Wait before trying manually;
                        exact concurrent quotas are deferred.
                      details: []
          x-error-codes:
          - short_live_path.creation_limited
        '503': &id001
          description: 'Temporary no-content refusal: unsafe readiness/clock, failed or uncertain store/accounting,
            corrupt metadata/payload/verifier, invalid trusted-address context, continuity recovery, or
            bounded work exhaustion. Never claim unknown/expired/incorrect code from a timeout. Creation
            may have occurred: preserve input, never automatically retry or return a link.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                service_unavailable:
                  value:
                    error:
                      code: short_live_path.service_unavailable
                      message: Service cannot safely complete the operation. No outcome is confirmed.
                      details: []
                capacity_unavailable:
                  value:
                    error:
                      code: short_live_path.capacity_unavailable
                      message: Temporary storage, limiter or bounded work capacity is unavailable.
                      details: []
          x-error-codes:
          - short_live_path.service_unavailable
          - short_live_path.capacity_unavailable
        '413':
          description: Body exceeds 524288 wire bytes; safe proxy/API refusal before expensive work.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_too_large:
                  value:
                    error:
                      code: short_live_path.request_too_large
                      message: Request body exceeds the permitted wire-byte limit. No link is confirmed.
                      details: []
          x-error-codes:
          - short_live_path.request_too_large
        '415':
          description: Unsupported media type or Content-Encoding; require uncompressed application/json.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupported_media_type:
                  value:
                    error:
                      code: short_live_path.unsupported_media_type
                      message: Use uncompressed application/json. Request media type or encoding is unsupported.
                      details: []
          x-error-codes:
          - short_live_path.unsupported_media_type
  /api/v1/secrets/{token}/status:
    parameters:
    - &id002
      name: token
      in: path
      required: true
      description: Share-link capability. Exactly 43 canonical unpadded base64url characters encoding
        32 bytes. Decode and re-encode to enforce canonical padding bits before lookup. Never log raw
        URL/path/token, bind it to a person, or accept an internal lifecycle UUID. Malformed tokens are
        safe unknown states on neutral status, and link_unavailable on disclosure; stop before digest/store
        lookup.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
        x-origin: data-model.md §Token and digest representation
        x-origin-confidence: high
      example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    get:
      operationId: getSecretStatus
      tags:
      - Secrets
      security: []
      summary: Inspect a neutral gate without disclosing or consuming a Secret
      description: Safe repeat visits and resume checks (S3/S6). No request body or Reading code; example
        request GET /api/v1/secrets/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/status. Validate token
        before lookup. Malformed/unknown returns state unknown without fragments. Known expiration is
        recognized from retained metadata without reading payloads, while global readiness remains mandatory.
        Recheck deadline before classifying missing payload or releasing gate. Never verify codes, modify
        deadlines, promise later readability or embed Secret in neutral HTML/preview.
      x-user-stories:
      - US-02
      - US-04
      - US-05
      x-acceptance-criteria:
      - AC-04
      - AC-08
      - AC-09
      - AC-10
      - AC-11
      - AC-11b
      - AC-12
      x-sequences:
      - S3
      - S6
      - S7
      responses:
        '200':
          description: Neutral gate or explicit unavailable lifecycle state; never Secret fields.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeutralGateResponse'
              examples:
                available:
                  value:
                    data:
                      state: available
                      reading_code_required: true
                      expires_at: '2026-01-01T13:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
                withoutCode:
                  value:
                    data:
                      state: available
                      reading_code_required: false
                      expires_at: '2026-01-01T13:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
                expired:
                  value:
                    data:
                      state: expired
                      expires_at: '2026-01-01T12:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T13:00:00.000Z'
                unknown:
                  value:
                    data:
                      state: unknown
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
                earlyLoss:
                  value:
                    data:
                      state: early_unavailable
                      expires_at: '2026-01-01T13:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
        '503': *id001
  /api/v1/secrets/{token}/disclosures:
    parameters:
    - *id002
    post:
      operationId: discloseSecret
      tags:
      - Secrets
      security: []
      summary: Explicitly show exact Secret text before expiration
      description: 'Only explicit Show triggers this request. No session, identity, consumption or view
        count; repeat and concurrent reading is permitted. Revalidate stored shape and authoritative lifecycle,
        check the basic pair counter and acquire the hard process-wide work permit before verification;
        recheck payload/readiness/PostgreSQL time after asynchronous work immediately before bounded nonstreaming
        release. Missing code is not a failed hash attempt. Wrong code returns only after failure accounting
        is confirmed; success does not erase previous failures. Admitted concurrent attempts may overshoot
        five; quota reservations/leases are deferred by ADR-0009. Check conservative monotonic deadline
        before display/copy; discard late or superseded responses, hide offline at expiry, conceal on
        background and require neutral recheck plus fresh Show on return. No automatic retries (they could
        spend verification allowance). Never claim remote erasure or external credential revocation. Accepted
        ADR-0006: 1024 UTF-8 code bytes, two concurrent hash calls across creation/disclosure, zero waiting
        queue. Invalid input or global capacity refusal starts no hash and adds no code failure. Retain
        permits until native completion after timeout/disconnect; late results do not authorize release.'
      x-user-stories:
      - US-03
      - US-04
      - US-05
      x-acceptance-criteria:
      - AC-03
      - AC-04
      - AC-06
      - AC-07
      - AC-08
      - AC-09
      - AC-10
      - AC-11
      - AC-11b
      - AC-12
      x-sequences:
      - S4
      - S5
      - S6
      - S7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscloseSecretRequest'
            examples:
              withoutCode:
                value: {}
              withCode:
                value:
                  reading_code: Test code 123
        x-max-wire-bytes: 524288
        x-allowed-content-encodings:
        - identity
        description: application/json only, absent or identity Content-Encoding; no compressed body. Enforce
          524288 wire bytes while receiving, including absent/chunked Content-Length. The wire budget
          includes escaping/packaging and is separate from Secret aggregate UTF-8 bytes. Reject unsupported
          media/encoding with 415 and oversized bodies with 413 before hashing or new admission state;
          safe no-store/no-referrer envelope, no input echo, no incorrect-code failure or confirmed link.
      responses:
        '200':
          description: Eligible exact text; original expiration is unchanged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscloseSecretResponse'
              examples:
                disclosed:
                  value:
                    data:
                      secret: *id003
                      expires_at: '2026-01-01T13:00:00.000Z'
                    meta:
                      service_time: '2026-01-01T12:00:00.000Z'
        '403':
          description: Missing required code, or incorrect code with confirmed failure accounting. No
            fragments or permanent consumption.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                code_required:
                  value:
                    error:
                      code: short_live_path.code_required
                      message: Enter the separate Reading code.
                      details: []
                code_incorrect:
                  value:
                    error:
                      code: short_live_path.code_incorrect
                      message: Reading code is incorrect. The link has not been consumed.
                      details: []
          x-error-codes:
          - short_live_path.code_required
          - short_live_path.code_incorrect
        '409':
          description: Malformed/unknown token or known unexpired missing payload. No recovery; request
            a new link. Frontend uses neutral status to distinguish unknown from early loss; never auto-disclose.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                link_unavailable:
                  value:
                    error:
                      code: short_live_path.link_unavailable
                      message: Secret is unavailable. Request a new Share link from the Sender; recovery
                        is not available.
                      details: []
          x-error-codes:
          - short_live_path.link_unavailable
        '410':
          description: Known expiration at any check, including final pre-release check after correct
            verification. Original web URL still renders explicit expiration, not a missing page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                link_expired:
                  value:
                    error:
                      code: short_live_path.link_expired
                      message: Share link has expired. External credentials and saved copies are not revoked.
                      details: []
          x-error-codes:
          - short_live_path.link_expired
        '422':
          description: Malformed JSON, unknown fields, null/non-string/non-scalar code, code over 1024
            UTF-8 bytes or invalid request shape. No hash or failed-code increment on invalid input.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  value:
                    error:
                      code: short_live_path.invalid_request
                      message: Request shape, exact-text or lifetime/code constraints are invalid.
                      details: []
          x-error-codes:
          - short_live_path.invalid_request
        '429':
          description: Basic observed threshold of five failures per rolling 60 seconds/link/address.
            Admitted concurrent attempts may overshoot; exact reservations are deferred. No hash, new
            failure timestamp, window extension, link-wide lockout or prior-failure reset.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                verification_limited:
                  value:
                    error:
                      code: short_live_path.verification_limited
                      message: Basic observed failure threshold for this link and address is reached.
                        Wait; exact concurrent quotas are deferred.
                      details: []
          x-error-codes:
          - short_live_path.verification_limited
        '503': *id001
        '413':
          description: Body exceeds 524288 wire bytes; safe proxy/API refusal before expensive work.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_too_large:
                  value:
                    error:
                      code: short_live_path.request_too_large
                      message: Request body exceeds the permitted wire-byte limit. No link is confirmed.
                      details: []
          x-error-codes:
          - short_live_path.request_too_large
        '415':
          description: Unsupported media type or Content-Encoding; require uncompressed application/json.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupported_media_type:
                  value:
                    error:
                      code: short_live_path.unsupported_media_type
                      message: Use uncompressed application/json. Request media type or encoding is unsupported.
                      details: []
          x-error-codes:
          - short_live_path.unsupported_media_type
components:
  headers:
    Cache-Control:
      description: Required on every response, including refusals.
      schema:
        type: string
        const: no-store
      example: no-store
    Referrer-Policy:
      description: Never forward credential-bearing URLs as referrers.
      schema:
        type: string
        const: no-referrer
      example: no-referrer
  schemas:
    Secret:
      type: object
      additionalProperties: false
      required:
      - address
      - login
      - credential
      properties:
        address:
          type: string
          description: Exact UTF-8 text; no trimming, normalization or newline conversion. Never interpret
            as HTML or automatically fetch/open an address.
          x-origin: data-model.md §ephemeral_secret.address; spec AC-02/AC-03
          x-origin-confidence: high
        login:
          type: string
          description: Exact UTF-8 text; no trimming, normalization or newline conversion. Never interpret
            as HTML or automatically fetch/open an address.
          x-origin: data-model.md §ephemeral_secret.login; spec AC-02/AC-03
          x-origin-confidence: high
        credential: &id004
          type: string
          description: Exact UTF-8 text; no trimming, normalization or newline conversion. Never interpret
            as HTML or automatically fetch/open an address.
          x-origin: data-model.md §ephemeral_secret.credential; spec AC-02/AC-03
          x-origin-confidence: high
      description: All three response fields are present; absent optional inputs become empty strings.
        credential is required and not whitespace-only. Sum of UTF-8 bytes of address, login and credential
        <= 65536. JSON Schema string length is NOT this aggregate byte limit. Revalidate stored records
        before release.
      x-max-aggregate-utf8-bytes: 65536
      x-non-whitespace-fields:
      - credential
    ReadingCode:
      type: string
      maxLength: 1024
      description: Exact code, including Unicode, case and spaces. Never trim or normalize. Plaintext
        travels only in HTTPS request bodies and is never stored or echoed. The create-only minimum is
        six Unicode code points; disclosure accepts shorter guesses for normal verification accounting.
        At most 1024 UTF-8 bytes (ADR-0006); maxLength counts code points and is only a necessary bound.
        Enforce x-max-utf8-bytes and scalar-text validity before hashing; never truncate. Codes over this
        bound return 422 invalid_request without a failed verification.
      x-max-utf8-bytes: 1024
      x-origin: spec AC-06/AC-07; data-model.md DM-OQ-01; ADR-0009 retained input budget
      x-origin-confidence: high
    CreateSecretRequest:
      type: object
      additionalProperties: false
      required:
      - credential
      properties:
        address:
          type: string
          description: Exact UTF-8 text; no trimming, normalization or newline conversion. Never interpret
            as HTML or automatically fetch/open an address.
          x-origin: data-model.md §ephemeral_secret.address; spec AC-02/AC-03
          x-origin-confidence: high
          default: ''
        login:
          type: string
          description: Exact UTF-8 text; no trimming, normalization or newline conversion. Never interpret
            as HTML or automatically fetch/open an address.
          x-origin: data-model.md §ephemeral_secret.login; spec AC-02/AC-03
          x-origin-confidence: high
          default: ''
        credential: *id004
        lifetime_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
          x-origin: data-model.md §link_lifecycles.expires_at - created_at; spec AC-04/AC-05
          x-origin-confidence: high
        reading_code:
          allOf:
          - $ref: '#/components/schemas/ReadingCode'
          minLength: 6
          description: Omit to disable code protection; null and an empty string are invalid when provided.
            At least six Unicode code points; no composition/complexity requirement.
          x-origin: spec AC-06; data-model.md §ephemeral_secret.code_verifier input
          x-origin-confidence: medium
      description: Same exact-text, required non-whitespace credential and aggregate 65536 UTF-8 byte
        constraints as Secret. Omitted lifetime defaults to 60; never round or clamp. All inputs must
        be well-formed Unicode scalar text; reject lone surrogates instead of lossy conversion.
      x-max-aggregate-utf8-bytes: 65536
      x-non-whitespace-fields:
      - credential
    DiscloseSecretRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        reading_code:
          $ref: '#/components/schemas/ReadingCode'
      description: Explicit Show only. Send {} for an unprotected link or when no code was entered; a
        protected link returns code_required. Supplying a code never enables protection on an unprotected
