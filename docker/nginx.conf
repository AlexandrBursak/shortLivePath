pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  access_log off;
  map $upstream_http_content_security_policy $web_csp {
    "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    default $upstream_http_content_security_policy;
  }
  server_tokens off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  # App owns the contracted 524288-byte boundary, including chunked requests.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  proxy_next_upstream off;
  proxy_connect_timeout 2s;
  proxy_read_timeout 35s;
  proxy_send_timeout 10s;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    location ^~ /health { return 404; }
    location /api/ {
      proxy_hide_header Cache-Control;
      proxy_hide_header Referrer-Policy;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Host $host;
      proxy_pass http://api:3333;
    }
    location / {
      # Next generates a fresh nonce CSP; errors fall back to deny-all.
      add_header Content-Security-Policy $web_csp always;
      proxy_hide_header Content-Security-Policy;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_hide_header Cache-Control;
      proxy_hide_header Referrer-Policy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://web:3000;
    }
  }
}
